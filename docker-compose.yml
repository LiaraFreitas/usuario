version: '3.8'

services:
  app:
    build: .
    ports:
      - "8082:8080"
    environment:
      environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: aloisk
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - shared network

networks:
  shared network:
    external: true
    name: dockerfiles_default